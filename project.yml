name: VoiceBubble
options:
  bundleIdPrefix: com.voicebubble
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "VoiceBubble Dev"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_HARDENED_RUNTIME: NO
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES

packages:
  speech-swift:
    url: https://github.com/soniqo/speech-swift
    from: "0.0.7"

targets:
  VoiceBubble:
    type: application
    platform: macOS
    sources:
      - path: VoiceBubble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicebubble.app
        INFOPLIST_FILE: VoiceBubble/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceBubble/VoiceBubble.entitlements
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: ["-framework", "ScreenCaptureKit"]
    dependencies:
      - package: speech-swift
        product: Qwen3ASR
      - package: speech-swift
        product: SpeechVAD
      - package: speech-swift
        product: AudioCommon
      - sdk: ScreenCaptureKit.framework
    entitlements:
      path: VoiceBubble/VoiceBubble.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: false
    info:
      path: VoiceBubble/Info.plist
      properties:
        CFBundleName: Voice Bubble
        CFBundleDisplayName: Voice Bubble
        CFBundleIdentifier: com.voicebubble.app
        CFBundleVersion: "1.0.0"
        CFBundleShortVersionString: "1.0.0"
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Voice Bubble 需要麦克风权限来录制语音"
        NSScreenCaptureUsageDescription: "Voice Bubble 需要屏幕录制权限来采集系统音频（会议纪要功能）"
        NSHumanReadableCopyright: "Copyright © 2026 Voice Bubble. All rights reserved."
